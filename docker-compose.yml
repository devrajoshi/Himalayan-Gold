services:
  postgres:
    image: postgres:16-alpine
    container_name: himalayan-gold-db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-himalayan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldpass123}
      POSTGRES_DB: ${POSTGRES_DB:-himalayan_gold}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-himalayan}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: himalayan-gold-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@himalayangold.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
